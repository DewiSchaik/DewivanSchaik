# Introtekst

Wat wil je een ander vertellen over je onderwerp ​

Hoe denk je dit te vertellen met eigen content? en met overige content zoals (links, afbeeldingen, tekst)

Schrijf een eerste stukje content als basis voor je garden (maximaal 180 tekens).
Voor mijn website heb ik ervoor gekozen om als onderwerp eigenlijk gewoon mijzelf te gebruiken. Ik wilde geen website maken over één specifiek onderwerp, maar juist een plek maken waar verschillende interesses van mij samenkomen. De website wordt een soort persoonlijk platform met dingen die ik leuk vind en waar ik zelf inspiratie uit haal.
Een groot onderdeel van mijn website gaat over reizen. Hierin wil ik verschillende bestemmingen laten zien met tips voor leuke accommodaties, bijzondere plekken en fotospots. Vooral de plekken die er mooi uitzien op foto’s vind ik interessant om te delen.
Daarnaast wil ik een onderdeel maken over films. Ik kijk graag verschillende soorten films, dus ik wil ze verdelen in genres. Bij iedere film kan ik mijn eigen rating geven en kort vertellen wat ik ervan vond. Op die manier wordt het echt mijn persoonlijke mening en niet alleen een lijst met films.
Als laatste lijkt het me leuk om ook kleding en outfits toe te voegen. Zo ontstaat er een website die eigenlijk een verzameling is van mijn interesses, smaak en persoonlijke aanbevelingen.
